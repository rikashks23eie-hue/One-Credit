    // 4. MEDICAL IMAGE ANALYSIS PAGE (With Drag-and-Drop & Live Hierarchical Agent Animation)
    function ImageAnalysis({ selectedDisease, onSelectDisease, onAnalysisComplete, onNavigate }) {
      useLucide();
      const [imageFile, setImageFile] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [currentAgentIdx, setCurrentAgentIdx] = useState(-1);
      const [completedAgents, setCompletedAgents] = useState([]);
      const [agentLogs, setAgentLogs] = useState({});

      const fileInputRef = useRef(null);

      // Handle Image File Input
      const handleFile = (file) => {
        if (!file) return;
        const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'];
        if (!validTypes.includes(file.type)) {
          alert('Please upload a valid JPG, PNG, or WEBP medical image.');
          return;
        }
        setImageFile(file);
        const reader = new FileReader();
        reader.onload = (e) => {
          setImagePreview(e.target.result);
        };
        reader.readAsDataURL(file);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFile(e.dataTransfer.files[0]);
        }
      };

      // Hierarchical Agent Execution Pipeline
      const runPipeline = async () => {
        if (!selectedDisease) {
          alert('Please select a condition from the database to analyze.');
          return;
        }

        setIsAnalyzing(true);
        setCompletedAgents([]);
        setCurrentAgentIdx(0);
        setAgentLogs({});

        const logs = {};

        for (let i = 0; i < AGENT_SEQUENCE.length; i++) {
          const agentId = AGENT_SEQUENCE[i];
          const agentObj = AGENTS.find(a => a.id === agentId);
          setCurrentAgentIdx(i);

          // Simulated processing duration per agent
          await new Promise(res => setTimeout(res, 750 + Math.random() * 400));

          // Generate simulated agent output
          if (agentId === 'supervisor') {
            logs[agentId] = `SUPERVISOR initialized. Task tree dispatched to 4 parallel level-1 diagnostic agents.`;
          } else if (agentId === 'image-validation') {
            logs[agentId] = imageFile 
              ? `Image verified: "${imageFile.name}" (${(imageFile.size / 1024).toFixed(1)} KB, ${imageFile.type}). No pixel corruption.`
              : `Reference mode: Disease benchmark baseline loaded.`;
          } else if (agentId === 'disease-detection') {
            logs[agentId] = `Identified: ${selectedDisease.name} (ICD: ${selectedDisease.icdCode}). Pattern correlation score: ${Math.floor(82 + Math.random() * 14)}%.`;
          } else if (agentId === 'symptom-analysis') {
            logs[agentId] = `Correlated ${selectedDisease.symptoms.length} symptom vectors. Dominant cluster: ${selectedDisease.symptoms.slice(0, 3).join(', ')}.`;
          } else if (agentId === 'risk-assessment') {
            logs[agentId] = `Risk evaluated as ${selectedDisease.riskLevel.toUpperCase()}. Flagged ${selectedDisease.warningSigns.length} warning thresholds.`;
          } else if (agentId === 'medicine-reference') {
            logs[agentId] = `Retrieved ${(selectedDisease.medicineIds || []).length} educational medicine reference entries with dosing precautions.`;
          } else if (agentId === 'recommendation') {
            logs[agentId] = `Synthesized ${selectedDisease.generalCare.length} lifestyle & general self-care recommendations.`;
          } else if (agentId === 'final-report') {
            logs[agentId] = `Final report compiled. Supervisor approved synthesis.`;
          }

          setAgentLogs({ ...logs });
          setCompletedAgents(prev => [...prev, agentId]);
        }

        setIsAnalyzing(false);

        // Build report result
        const finalResult = {
          disease: selectedDisease,
          imageName: imageFile ? imageFile.name : 'Reference Clinical Dataset',
          imageSize: imageFile ? `${(imageFile.size / 1024).toFixed(1)} KB` : 'N/A',
          imagePreview: imagePreview,
          confidence: Math.floor(84 + Math.random() * 12),
          timestamp: new Date().toLocaleString(),
          agentLogs: logs,
          isDemo: true
        };

        onAnalysisComplete(finalResult);
      };

      return (
        <div className="p-6 max-w-7xl mx-auto space-y-6">
          <div>
            <div className="flex items-center gap-3">

          </div>

          {/* General Care & Self-Management */}
          <div className="glow-card p-6 rounded-xl space-y-3">
            <h4 className="text-sm font-bold text-emerald-400 uppercase tracking-wider font-mono flex items-center gap-2">
              <i data-lucide="check-circle" className="w-4 h-4 text-emerald-400"></i> General Self-Care & Lifestyle Recommendations
            </h4>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs text-clinical-300">
              {disease.generalCare.map((gc, idx) => (
                <div key={idx} className="p-3 rounded-lg bg-clinical-950 border border-clinical-800 flex items-start gap-2">
                  <span className="text-emerald-400 font-bold">✓</span>
                  <span>{gc}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Medicine References */}
          {relatedMeds.length > 0 && (
            <div className="glow-card p-6 rounded-xl space-y-4">
              <div className="flex items-center justify-between">
                <div>
                  <h4 className="text-sm font-bold text-white flex items-center gap-2">
                    <i data-lucide="pill" className="w-4 h-4 text-amber-400"></i>
                    Educational Medicine References ({relatedMeds.length})
                  </h4>
                  <p className="text-xs text-amber-400/80 mt-0.5">
                    General educational information. Medicine selection and dosage must be confirmed by a qualified healthcare professional.
                  </p>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {relatedMeds.map(m => (
                  <div key={m.id} className="p-4 rounded-xl bg-clinical-950 border border-blood-950 space-y-2">
                    <div className="flex items-center justify-between">
                      <h5 className="font-bold text-sm text-white">{m.name}</h5>
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-clinical-900 text-clinical-400">
                        {m.genericName}
                      </span>
                    </div>
                    <div className="text-xs text-clinical-400">{m.purpose}</div>
                    <div className="text-[11px] text-clinical-300">
                      <strong>Form & Strengths:</strong> {m.form} ({m.commonStrengths.join(', ')})
                    </div>
                    <div className="text-[11px] text-amber-400/90 font-medium">
                      <strong>Ref. Frequency:</strong> {m.referenceFrequency}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Agent Execution Timeline Summary */}
          <div className="glow-card p-5 rounded-xl space-y-3">
            <h4 className="text-xs font-mono font-bold text-clinical-400 uppercase tracking-wider">
              Agent Execution Audit Trace
            </h4>
            <div className="space-y-1.5">
              {AGENTS.map(agent => (
                <div key={agent.id} className="flex items-center justify-between text-xs py-1.5 border-b border-clinical-900/60 last:border-0">
                  <span className="font-mono text-clinical-300 flex items-center gap-2">
                    <span className="text-emerald-400">✔</span> {agent.name} ({agent.shortName})
                  </span>
                  <span className="text-clinical-500 font-mono text-[11px] max-w-md truncate">
                    {agentLogs ? agentLogs[agent.id] : 'Completed successfully.'}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // 7. ANALYTICS PAGE (Chart.js Native Canvas Render)
    function Analytics() {
      useLucide();
      const chartRef1 = useRef(null);
      const chartRef2 = useRef(null);

      useEffect(() => {
        let chart1Instance = null;
        let chart2Instance = null;

        // Category count dataset
        const catLabels = DISEASE_CATEGORIES;
        const catCounts = DISEASE_CATEGORIES.map(c => DISEASES.filter(d => d.category === c).length);

        if (chartRef1.current) {
          chart1Instance = new Chart(chartRef1.current, {
            type: 'bar',
            data: {
              labels: catLabels,
              datasets: [{
                label: 'Conditions',
                data: catCounts,
                backgroundColor: '#dc2626',
                borderRadius: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { ticks: { color: '#a3a3a3', font: { size: 10 } }, grid: { display: false } },
                y: { ticks: { color: '#a3a3a3', stepSize: 1 }, grid: { color: '#1f1f1f' } }
              }
            }
          });
        }

        // Risk distribution dataset
        const riskCounts = [
          DISEASES.filter(d => d.riskLevel === 'critical').length,
          DISEASES.filter(d => d.riskLevel === 'high').length,
          DISEASES.filter(d => d.riskLevel === 'medium').length,
          DISEASES.filter(d => d.riskLevel === 'low').length,
        ];

        if (chartRef2.current) {
          chart2Instance = new Chart(chartRef2.current, {
            type: 'doughnut',
            data: {
              labels: ['Critical Risk', 'High Risk', 'Medium Risk', 'Low Risk'],
              datasets: [{
                data: riskCounts,
                backgroundColor: ['#dc2626', '#f97316', '#eab308', '#22c55e'],
                borderColor: '#0a0a0a',
                borderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { color: '#d4d4d4', boxWidth: 12 } }
              }
            }
          });
        }

        return () => {
          if (chart1Instance) chart1Instance.destroy();
          if (chart2Instance) chart2Instance.destroy();
        };
      }, []);

      return (
        <div className="p-6 max-w-7xl mx-auto space-y-6">
          <div>
            <h2 className="text-2xl font-black text-white">System Analytics & Distribution</h2>
            <p className="text-xs text-clinical-400 mt-1">Medical intelligence database statistics and risk stratification metrics</p>
          </div>

          <DisclaimerBanner />

          {/* Stat Counter Grid */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div className="glow-card p-5 rounded-xl text-center">
              <div className="text-3xl font-black text-red-400">{DISEASES.length}</div>
              <div className="text-xs text-clinical-400 mt-1">Total Diseases</div>
            </div>
            <div className="glow-card p-5 rounded-xl text-center">
              <div className="text-3xl font-black text-amber-400">{Object.keys(MEDICINES).length}</div>
              <div className="text-xs text-clinical-400 mt-1">Medicines Indexed</div>
            </div>
            <div className="glow-card p-5 rounded-xl text-center">
              <div className="text-3xl font-black text-rose-400">{DISEASE_CATEGORIES.length}</div>
              <div className="text-xs text-clinical-400 mt-1">Medical Domains</div>
            </div>
            <div className="glow-card p-5 rounded-xl text-center">
              <div className="text-3xl font-black text-emerald-400">{AGENTS.length}</div>
              <div className="text-xs text-clinical-400 mt-1">Hierarchical Agents</div>
            </div>
          </div>

          {/* Charts Row */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Category Distribution */}
            <div className="glow-card p-6 rounded-xl space-y-4">
              <h3 className="text-sm font-bold text-white flex items-center gap-2">
                <i data-lucide="bar-chart-3" className="w-4 h-4 text-blood-400"></i>
                Disease Distribution by Medical Category
              </h3>
              <div className="h-64">
                <canvas ref={chartRef1}></canvas>
              </div>
            </div>

            {/* Risk Level Distribution */}
            <div className="glow-card p-6 rounded-xl space-y-4">
              <h3 className="text-sm font-bold text-white flex items-center gap-2">
                <i data-lucide="pie-chart" className="w-4 h-4 text-blood-400"></i>
                Risk Stratification Breakdown
              </h3>
              <div className="h-64">
                <canvas ref={chartRef2}></canvas>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- MAIN APP CONTAINER WITH SIDEBAR & ROUTING ---
    function App() {
      useLucide();
      const [currentPage, setCurrentPage] = useState('command');
      const [selectedDisease, setSelectedDisease] = useState(DISEASES[0]); // Default to Type 2 Diabetes
      const [analysisReport, setAnalysisReport] = useState(null);

      const navItems = [
        { id: 'command', label: 'Command Center', icon: 'layout-dashboard' },
        { id: 'disease', label: 'Disease Intel', icon: 'brain' },
        { id: 'medicine', label: 'Medicine Vault', icon: 'pill' },
        { id: 'analysis', label: 'Image Analysis', icon: 'scan-eye', badge: 'DEMO' },
        { id: 'supervisor', label: 'Supervisor Control', icon: 'network' },
        { id: 'report', label: 'Analysis Report', icon: 'file-text' },
        { id: 'analytics', label: 'Analytics', icon: 'bar-chart-3' }
      ];

      return (
        <div className="flex min-h-screen bg-[#0a0a0a]">
          {/* Left Sidebar */}
          <aside className="w-60 bg-[#0f0508] border-r border-blood-900/30 flex flex-col justify-between flex-shrink-0 z-30">
            <div>
              {/* Logo */}
              <div className="p-5 border-b border-blood-900/30 flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-blood-700 to-blood-500 flex items-center justify-center text-white shadow-[0_0_12px_rgba(220,38,38,0.5)]">
                  <i data-lucide="activity" className="w-5 h-5"></i>
                </div>
                <div>
                  <div className="text-xs font-black text-white tracking-wider">MED-HMAS</div>
                  <div className="text-[9px] font-mono text-blood-400">HIERARCHICAL V2.0</div>
                </div>
              </div>

              {/* Status Pill */}
              <div className="mx-3 my-3 px-3 py-2 rounded-lg bg-blood-950/40 border border-blood-900/40">
                <div className="flex items-center gap-1.5 text-[10px] font-mono text-emerald-400 font-bold">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  ALL 8 AGENTS READY
                </div>
                <div className="text-[9px] text-clinical-500 font-mono mt-0.5">SUPERVISOR: ACTIVE</div>
              </div>

              {/* Navigation Items */}
              <nav className="p-3 space-y-1">
                {navItems.map(item => {
                  const isActive = currentPage === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setCurrentPage(item.id)}
                      className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-medium transition ${
                        isActive
                          ? 'bg-blood-900/40 border border-blood-700/60 text-blood-300 shadow-[0_0_10px_rgba(220,38,38,0.2)]'
                          : 'text-clinical-400 hover:text-white hover:bg-clinical-950'
                      }`}
                    >
                      <div className="flex items-center gap-2.5">
                        <i data-lucide={item.icon} className={`w-4 h-4 ${isActive ? 'text-blood-400' : 'text-clinical-500'}`}></i>
                        <span>{item.label}</span>
                      </div>
                      {item.badge && (
                        <span className="px-1.5 py-0.2 text-[9px] font-mono font-bold bg-blood-600 text-white rounded">
                          {item.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </nav>
            </div>

            {/* Sidebar Footer */}
            <div className="p-3 border-t border-blood-900/30">
              <div className="p-2.5 rounded-lg bg-blood-950/60 border border-blood-900/40 text-[9px] text-clinical-400 leading-tight">
                Standalone Browser Edition · No Server Required
              </div>
            </div>
          </aside>

          {/* Main Content Area */}
          <div className="flex-1 flex flex-col min-w-0">
            {/* Topbar */}
            <header className="h-14 border-b border-blood-900/30 bg-[#0f0508]/80 backdrop-blur px-6 flex items-center justify-between z-20">
              <div className="flex items-center gap-2 text-xs font-mono text-clinical-400">
                <span>SYSTEM:</span>
                <span className="text-white font-bold uppercase">{currentPage}</span>
              </div>
              <div className="flex items-center gap-3">
                <span className="hidden sm:inline-flex px-3 py-1 rounded-full bg-blood-950 border border-blood-900 text-blood-400 text-[10px] font-mono font-bold">
                  LOCAL DEMO AI · ZERO CLOUD ML
                </span>
                <div className="flex items-center gap-1.5 text-xs text-emerald-400 font-mono font-semibold">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  STANDALONE
                </div>
              </div>
            </header>

            {/* Dynamic Page Router */}
            <main className="flex-1 overflow-y-auto">
              {currentPage === 'command' && (
                <CommandCenter 
                  onNavigate={setCurrentPage} 
                  onSelectDiseaseForAnalysis={setSelectedDisease} 
                />
              )}
              {currentPage === 'disease' && (
                <DiseaseIntelligence 
                  onSelectDiseaseForAnalysis={setSelectedDisease}
                  onNavigate={setCurrentPage}
                />
              )}
              {currentPage === 'medicine' && (
                <MedicineVault onNavigate={setCurrentPage} />
              )}
              {currentPage === 'analysis' && (
                <ImageAnalysis 
                  selectedDisease={selectedDisease}
                  onSelectDisease={setSelectedDisease}
                  onAnalysisComplete={(res) => {
                    setAnalysisReport(res);
                    setCurrentPage('report');
                  }}
                  onNavigate={setCurrentPage}
                />
              )}
              {currentPage === 'supervisor' && (
                <SupervisorControl />
              )}
              {currentPage === 'report' && (
                <AnalysisReport 
                  report={analysisReport} 
                  onNavigate={setCurrentPage} 
                />
              )}
              {currentPage === 'analytics' && (
                <Analytics />
              )}
            </main>

            {/* Global Disclaimer Footer Bar */}
            <footer className="py-2.5 px-6 border-t border-blood-900/30 bg-[#0a0a0a] text-[10px] text-clinical-500 text-center">
              Educational healthcare demonstration only. This application does not provide confirmed medical diagnosis or personalized prescriptions. Medicine and dosage information is for general educational reference only. Consult a qualified healthcare professional.
            </footer>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
